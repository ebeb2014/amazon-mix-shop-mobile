name: Build Live desktop update
on:
  push:
    paths: ['desktop-live/**', '.github/workflows/build-live-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned desktop source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.6.15 --repo ebeb2014/amazon-mix-shop-desktop --pattern AMS_SURSE_V24_20.zip
          if ((Get-FileHash AMS_SURSE_V24_20.zip -Algorithm SHA256).Hash.ToLower() -ne '2e254228a140a4f20cecc892ae116966954434de555781d2499ada10289a9482') { throw 'Source checksum mismatch' }
          Expand-Archive AMS_SURSE_V24_20.zip unpack
          $main = Get-ChildItem unpack -Recurse -Filter app_P13_11_3_ATOMIC_DEV.py | Select-Object -First 1
          "AMS_LIVE_SOURCE=$($main.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
          python desktop-live/prepare.py $main.Directory.FullName
      - name: Install build dependencies
        run: python -m pip install customtkinter pandas openpyxl openai google-genai keyring qrcode pillow pillow-heif deep-translator pdfplumber reportlab pyinstaller
      - name: Compile and verify
        shell: pwsh
        run: |
          python -m unittest discover -s desktop-live -p 'test_*.py' -v
          $root = $env:AMS_LIVE_SOURCE
          python -m compileall -q $root
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AmazonMixShop-Live --paths $root --hidden-import p14_speed_accuracy --hidden-import p15_pallet_features --hidden-import p16_accounting_export --hidden-import p17_losses --hidden-import p18_offline_queue --hidden-import p19_multi_bon --hidden-import p20_offline_catalog --hidden-import p21_live_orders --hidden-import smartbill_support --hidden-import cloud_support --hidden-import database --collect-all reportlab --collect-all openpyxl --collect-all customtkinter --collect-all pillow_heif --collect-all google --distpath output --workpath build --specpath build (Join-Path $root 'app_P13_11_3_ATOMIC_DEV.py')
          if (-not (Test-Path output/AmazonMixShop-Live.exe)) { throw 'Missing executable' }
          Copy-Item desktop-live/Actualizeaza.* output
          Copy-Item desktop-live/CITESTE.txt output
          (Get-FileHash output/AmazonMixShop-Live.exe -Algorithm SHA256).Hash | Out-File output/SHA256.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Amazon-Mix-Shop-Live-PC-1.6.21
          path: output/*
          retention-days: 30
